services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?initialize the VNext demo environment first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?initialize the VNext demo environment first}
      POSTGRES_DB: ${POSTGRES_DB:?initialize the VNext demo environment first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?initialize the VNext demo environment first}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    build:
      context: ../minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?initialize the VNext demo environment first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?initialize the VNext demo environment first}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:?initialize the VNext demo environment first}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:?initialize the VNext demo environment first}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
