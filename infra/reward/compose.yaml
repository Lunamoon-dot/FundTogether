name: fundtogether-reward
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${REWARD_DATABASE_PASSWORD:?Reward database password required}
      POSTGRES_DB: fundtogether_reward
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - reward-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fundtogether_reward"]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    build: ../minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Reward storage access key required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Reward storage password required}
    ports:
      - "127.0.0.1:9202:9000"
      - "127.0.0.1:9203:9001"
    volumes:
      - reward-minio:/data
volumes:
  reward-postgres:
  reward-minio:
